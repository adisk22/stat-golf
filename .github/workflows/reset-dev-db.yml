name: Reset dev database (wipes data)

# Drops everything in the DEV project, re-applies migrations and the fake seed.
# Refuses unless the repo variable SUPABASE_ENV is "dev", the project is the
# configured dev project, and you type its project ID to confirm.
#
# Repo variables: SUPABASE_ENV=dev, SUPABASE_PROJECT_ID, SUPABASE_DEV_PROJECT_ID

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the dev project ID to confirm wiping it"
        required: true

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_DEV_PROJECT_ID: ${{ vars.SUPABASE_DEV_PROJECT_ID }}
      SUPABASE_ENV: ${{ vars.SUPABASE_ENV }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Confirm target
        run: |
          if [ "$CONFIRM" != "$SUPABASE_DEV_PROJECT_ID" ]; then
            echo "::error::Confirmation does not match SUPABASE_DEV_PROJECT_ID"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset
