name: Deploy database

# Pushes supabase/migrations to the hosted Supabase project.
# Runs on merges to main that touch migrations, or manually (optionally with the demo seed).
#
# Repo settings → Secrets and variables → Actions:
#   secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   variables: SUPABASE_PROJECT_ID

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load supabase/seed.sql (FAKE demo puzzles). Only seeds once."
        type: boolean
        default: false

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -n "$SUPABASE_PROJECT_ID" ] || missing="$missing SUPABASE_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push migrations${{ inputs.seed && ' and seed' || '' }}
        run: pnpm db:push ${{ inputs.seed && '--seed' || '' }}
